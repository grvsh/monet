server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;

    # ── Static assets (Vite content-hashed filenames) ─────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Proxy /api/* to FastAPI backend ───────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Required for binary media streaming (thumbnails, previews)
        proxy_buffering    off;
        # Generous timeout — scan and processing jobs can be slow
        proxy_read_timeout 300s;
        # Pass httpOnly refresh_token cookie through
        proxy_pass_header  Set-Cookie;
    }

    # ── SPA fallback — react-router-dom handles client-side routing ───────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
