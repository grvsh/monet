[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monet-ml"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.20",
    "Pillow>=11.1",
    "numpy>=2.2",
    # PyTorch is pre-installed in the base image; listed here for pip resolution.
    "torch>=2.5",
    "torchvision>=0.20",
    # OpenCLIP: ViT-H-14 for CLIP embeddings
    "open-clip-torch>=2.26",
    "timm>=1.0",
    # HuggingFace Transformers: DINOv2 + Moondream2.
    # Cap at <5.0 — transformers 5.x broke moondream2's custom class (all_tied_weights_keys).
    "transformers>=4.46,<5.0",
    "accelerate>=1.0",
    # Face detection + recognition
    "insightface>=0.7",
    "onnxruntime-gpu>=1.19",
    # Object detection
    "ultralytics>=8.3",
    # HuggingFace Hub for model downloads
    "huggingface-hub>=0.26",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
